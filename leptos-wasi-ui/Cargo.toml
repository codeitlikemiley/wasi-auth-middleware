[package]
name = "leptos-wasi-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
description = "Premium, configurable Leptos UI components for WASI authentication."
repository = "https://github.com/codeitlikemiley/wasi-auth-middleware"

[dependencies]
leptos = { version = "0.8.9", default-features = false }
leptos_router = { version = "0.8.7", default-features = false }
leptos-wasi-auth = { version = "0.1.0", path = "../leptos-wasi-auth", default-features = false }
wasi-auth-core = { version = "0.1.0", path = "../wasi-auth-core" }
wasi-auth-traits = { version = "0.1.0", path = "../wasi-auth-traits" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }

# Client-only browser support dependencies (for WebAuthn/Passkey ceremonies)
wasm-bindgen = { version = "=0.2.103", optional = true }
wasm-bindgen-futures = { version = "0.4.53", optional = true }
js-sys = { version = "0.3.80", optional = true }
web-sys = { version = "0.3.80", optional = true, features = [
    "Window",
    "Navigator",
    "CredentialsContainer",
    "Credential",
    "PublicKeyCredential",
    "CredentialCreationOptions",
    "PublicKeyCredentialCreationOptions",
    "PublicKeyCredentialRequestOptions",
    "PublicKeyCredentialUserEntity",
    "PublicKeyCredentialRpEntity",
    "PublicKeyCredentialParameters",
    "PublicKeyCredentialDescriptor",
    "AuthenticatorSelectionCriteria",
    "AuthenticatorResponse",
    "AuthenticatorAttestationResponse",
    "AuthenticatorAssertionResponse",
    "CredentialRequestOptions",
] }

[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos-wasi-auth/ssr",
]
hydrate = [
    "leptos/hydrate",
    "leptos-wasi-auth/hydrate",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
]
csr = [
    "leptos/csr",
    "leptos-wasi-auth/csr",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
]
passkey = ["wasi-auth-core/passkey"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
any_spawner = { version = "0.3.0", default-features = false, features = ["futures-executor"] }

